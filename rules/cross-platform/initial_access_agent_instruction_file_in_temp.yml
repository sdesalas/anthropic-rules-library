id: fa1d18aa-eb58-52f3-8097-d3e9c7e1cd34_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies a CLAUDE.md, AGENTS.md or .cursorrules file created in a temporary folder. Agents read these files as instructions, and attackers plant them where an agent may be pointed at to work.
  from: now-9m
  index:
    - "logs-endpoint.events.file*"
  language: eql
  license: Elastic License v2
  name: Agent Instruction File Created in a Temporary Folder
  note: |
    ## Triage and analysis

    ### Investigating Agent Instruction File Created in a Temporary Folder

    ### Possible investigation steps

    - Read the file and look for instructions to run commands or send data.
    - Identify the process that wrote it.

    ### False positive analysis

    - Test suites for agent tooling write these files. Exclude them by `process.executable`.
  query: |
    file where event.type == "creation" and
      file.name : ("CLAUDE.md", "AGENTS.md", ".cursorrules") and
      file.path : ("/tmp/*", "/var/tmp/*", "/private/tmp/*", "?:\\Users\\*\\AppData\\Local\\Temp\\*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 21
  rule_id: fa1d18aa-eb58-52f3-8097-d3e9c7e1cd34
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: low
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Execution"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0051"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
      technique:
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0005
        name: Execution
        reference: "https://atlas.mitre.org/tactics/AML.TA0005/"
      technique:
        - id: AML.T0051
          name: LLM Prompt Injection
          reference: "https://atlas.mitre.org/techniques/AML.T0051/"
  timestamp_override: event.ingested
  type: eql
  version: 1
