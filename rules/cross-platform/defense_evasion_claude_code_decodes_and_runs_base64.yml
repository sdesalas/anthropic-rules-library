id: "7d9d3222-8e07-5ea4-8737-2155315617d0_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code decoding a base64 payload and running it. Encoding hides the command from the user and from reviews of the agent transcript.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Base64 Payload Decoded and Run by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Base64 Payload Decoded and Run by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Decode the payload and review it.
    - Find the content that supplied the payload.

    ### False positive analysis

    - Some build steps decode embedded assets. Confirm with the user.
  query: |
    process where event.type == "start" and (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
      process.command_line : ("*base64 -d*|*sh*", "*base64 --decode*|*sh*", "*FromBase64String*", "*b64decode*exec*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "7d9d3222-8e07-5ea4-8737-2155315617d0"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Defense Evasion"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0068"
    - "Mitre Atlas: AML.T0053"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0007
        name: Defense Evasion
        reference: "https://atlas.mitre.org/tactics/AML.TA0007/"
      technique:
        - id: AML.T0068
          name: LLM Prompt Obfuscation
          reference: "https://atlas.mitre.org/techniques/AML.T0068/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0005
        name: Execution
        reference: "https://atlas.mitre.org/tactics/AML.TA0005/"
      technique:
        - id: AML.T0053
          name: AI Agent Tool Invocation
          reference: "https://atlas.mitre.org/techniques/AML.T0053/"
  timestamp_override: event.ingested
  type: eql
  version: 1
