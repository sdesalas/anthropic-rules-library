id: "88ebfb94-00eb-5217-ad85-f111912aca8f_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies an MCP server process, or a process it started, reading an SSH private key. Poisoned MCP servers have been used to steal keys from developer machines.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: SSH Private Key Read by an MCP Server
  note: |
    ## Triage and analysis

    ### Investigating SSH Private Key Read by an MCP Server

    ### Possible investigation steps

    - Identify the MCP server package and its publisher.
    - Rotate the key and check where else it is authorized.

    ### False positive analysis

    - None expected.
  query: |
    process where event.type == "start" and
      process.parent.args : ("*mcp-server*", "*@modelcontextprotocol/*", "*mcp_server*") and
      process.command_line : "*/.ssh/id_*" and not process.command_line : "*.pub*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "88ebfb94-00eb-5217-ad85-f111912aca8f"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Credential Access"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Mitre Atlas: AML.T0110"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.004
              name: Private Keys
              reference: "https://attack.mitre.org/techniques/T1552/004/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0006
        name: Persistence
        reference: "https://atlas.mitre.org/tactics/AML.TA0006/"
      technique:
        - id: AML.T0110
          name: AI Agent Tool Poisoning
          reference: "https://atlas.mitre.org/techniques/AML.T0110/"
  timestamp_override: event.ingested
  type: eql
  version: 1
