id: dbd608b6-b3a3-42f6-a175-759b05898a43_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code, or a shell it opened, reading cloud, Kubernetes, registry or SSH credential files, or Claude Code's own credentials file. Malicious packages and injected prompts have used coding agents to search for and collect these files.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Credential File Read by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Credential File Read by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review which file was read and what the session did with its contents.
    - Check for outbound connections from the same session after the read.
    - Rotate the credentials in the file if the read was not requested by the user.

    ### False positive analysis

    - Debugging a cloud or Kubernetes setup can involve reading the config. Confirm with the user.
  query: |
    process where event.type == "start" and
      (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
      process.name : ("cat", "head", "tail", "less", "more", "base64", "xxd", "cp", "scp", "tar", "zip", "type", "powershell.exe", "pwsh.exe") and
      process.command_line : (
        "*/.aws/credentials*",
        "*/.config/gcloud/*credentials*",
        "*/.azure/accessTokens.json*",
        "*/.azure/msal_token_cache*",
        "*/.kube/config*",
        "*/.docker/config.json*",
        "*/.npmrc*",
        "*/.netrc*",
        "*/.ssh/id_*",
        "*/.claude/.credentials.json*",
        "*\\.aws\\credentials*",
        "*\\.kube\\config*",
        "*\\.ssh\\id_*"
      ) and
      not process.command_line : "*.pub*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: dbd608b6-b3a3-42f6-a175-759b05898a43
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Mitre Atlas: AML.T0055"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
            - id: T1552.004
              name: Private Keys
              reference: "https://attack.mitre.org/techniques/T1552/004/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
        - id: AML.T0055
          name: Unsecured Credentials
          reference: "https://atlas.mitre.org/techniques/AML.T0055/"
  timestamp_override: event.ingested
  type: eql
  version: 1
