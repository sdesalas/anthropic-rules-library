id: "47d3e7d4-cb51-458f-9e57-37a6d10dc046_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies an Anthropic API, admin or OAuth key in a process command line. Command lines are logged and visible to other users on the host, so a key passed this way should be treated as exposed.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Anthropic API Key in a Process Command Line
  note: |
    ## Triage and analysis

    ### Investigating Anthropic API Key in a Process Command Line

    ### Possible investigation steps

    - Identify the key from its prefix and last characters, and the workspace it belongs to, in the Claude Console.
    - Rotate the key.
    - Find the script or config that passes the key on the command line and move it to an environment variable or a secrets manager.

    ### False positive analysis

    - None expected. Even test keys should not be passed on the command line.
  query: |
    process where event.type == "start" and
      process.command_line : ("*sk-ant-api0*", "*sk-ant-admin0*", "*sk-ant-oat0*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "47d3e7d4-cb51-458f-9e57-37a6d10dc046"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0055"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0055
          name: Unsecured Credentials
          reference: "https://atlas.mitre.org/techniques/AML.T0055/"
  timestamp_override: event.ingested
  type: eql
  version: 1
