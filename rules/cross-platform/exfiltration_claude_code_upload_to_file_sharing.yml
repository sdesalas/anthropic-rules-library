id: "8e589c03-cff5-4186-8ff8-66cf3d083934_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code, or a shell it opened, using curl or wget against a paste site, an anonymous file sharing site or a request capture service. Injected instructions often ask the agent to send data to one of these.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Data Sent to a File Sharing or Request Capture Site by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Data Sent to a File Sharing or Request Capture Site by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review the data sent in `process.command_line`: inline data, a file argument or piped input.
    - Find the content the agent read before the request, such as a README, an issue comment or MCP tool output.
    - Rotate any secrets that may have been sent.

    ### False positive analysis

    - Developers test webhooks against request capture services. Confirm with the user.
  query: |
    process where event.type == "start" and
      (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
      process.name : ("curl", "curl.exe", "wget", "wget.exe") and
      process.command_line : (
        "*transfer.sh*", "*temp.sh*", "*0x0.st*", "*file.io*", "*bashupload.com*",
        "*pastebin.com*", "*paste.rs*", "*paste.ee*", "*hastebin*",
        "*webhook.site*", "*requestbin*", "*pipedream.net*", "*ngrok*",
        "*interact.sh*", "*oast.*", "*burpcollaborator.net*"
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "8e589c03-cff5-4186-8ff8-66cf3d083934"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Exfiltration"
    - "Data Source: Elastic Defend"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0086"
    - "Mitre Atlas: AML.T0051"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0010
        name: Exfiltration
        reference: "https://attack.mitre.org/tactics/TA0010/"
      technique:
