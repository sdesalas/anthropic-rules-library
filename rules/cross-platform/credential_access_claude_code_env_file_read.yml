id: "2a71fef8-8719-5b1b-8221-0a087eab7f69_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code, or a shell it opened, printing a .env file. These files hold API keys, including Anthropic keys, and their contents end up in the agent transcript.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Environment File Read by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Environment File Read by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Check which secrets the file holds.
    - Rotate them if the transcript is shared or stored.

    ### False positive analysis

    - Debugging configuration with an agent. Confirm with the user.
  query: |
    process where event.type == "start" and (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
      process.name : ("cat", "head", "tail", "less", "more", "type") and
      process.command_line : ("*.env", "*.env.*", "*/.env *")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "2a71fef8-8719-5b1b-8221-0a087eab7f69"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Credential Access"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
  timestamp_override: event.ingested
  type: eql
  version: 1
