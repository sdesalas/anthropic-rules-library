id: "5d8caccf-12e1-563c-98d5-0566bf50be98_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies a Claude Code settings file edited in place with sed, perl, jq or a Python one-liner. Scripted edits to these files can quietly add allowed commands, hooks or MCP servers.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Claude Code Settings Edited In Place from the Command Line
  note: |
    ## Triage and analysis

    ### Investigating Claude Code Settings Edited In Place from the Command Line

    ### Possible investigation steps

    - Compare the settings file with its last known good copy.
    - Review the parent process of the edit.

    ### False positive analysis

    - Onboarding scripts configure Claude Code. Exclude them by `process.parent.executable`.
  query: |
    process where event.type == "start" and
      process.name : ("sed", "perl", "jq", "python", "python3", "node") and
      process.command_line : ("*/.claude/settings.json*", "*/.claude/settings.local.json*", "*\\.claude\\settings.json*") and
      process.command_line : ("* -i*", "*>*", "*writeFile*", "*open(*w*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "5d8caccf-12e1-563c-98d5-0566bf50be98"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Defense Evasion"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0081"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0006
        name: Persistence
        reference: "https://atlas.mitre.org/tactics/AML.TA0006/"
      technique:
        - id: AML.T0081
          name: Modify AI Agent Configuration
          reference: "https://atlas.mitre.org/techniques/AML.T0081/"
  timestamp_override: event.ingested
  type: eql
  version: 1
