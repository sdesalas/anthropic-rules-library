id: fb705961-f2fe-5f3c-bd64-f3d242168110_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies the Claude Code credentials file being copied, archived or uploaded. The file holds the user's session token, which works from any machine until it expires.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Claude Code Credentials File Copied or Archived
  note: |
    ## Triage and analysis

    ### Investigating Claude Code Credentials File Copied or Archived

    ### Possible investigation steps

    - Identify where the file was copied to.
    - Log the user out of Claude Code to revoke the token.

    ### False positive analysis

    - Backups of the home folder. Exclude backup tools by `process.parent.executable`.
  query: |
    process where event.type == "start" and
      process.name : ("cp", "scp", "rsync", "tar", "zip", "7z", "curl", "curl.exe") and
      process.command_line : ("*/.claude/.credentials.json*", "*\.claude\.credentials.json*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: fb705961-f2fe-5f3c-bd64-f3d242168110
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Credential Access"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0083"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0083
          name: Credentials from AI Agent Configuration
          reference: "https://atlas.mitre.org/techniques/AML.T0083/"
  timestamp_override: event.ingested
  type: eql
  version: 1
