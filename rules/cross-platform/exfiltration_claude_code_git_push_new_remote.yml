id: a5deb6ee-39ca-5549-8cda-f90959f28a8e_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code adding a git remote and pushing to it within ten minutes. Pushing a repository to an outside remote copies its full history, including any secrets in it.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Git Remote Added and Pushed by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Git Remote Added and Pushed by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review the remote URL and who owns it.
    - Check what branches and history were pushed.

    ### False positive analysis

    - Users ask agents to publish a new repository. Confirm with the user.
  query: |
    sequence by host.id with maxspan=10m
      [process where event.type == "start" and (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
        process.name : ("git", "git.exe") and process.args : "remote" and process.args : "add"]
      [process where event.type == "start" and (process.parent.name : ("claude", "claude.exe") or process.parent.command_line : "*.claude?shell-snapshots*") and
        process.name : ("git", "git.exe") and process.args : "push"]
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: a5deb6ee-39ca-5549-8cda-f90959f28a8e
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Exfiltration"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0086"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0010
        name: Exfiltration
        reference: "https://attack.mitre.org/tactics/TA0010/"
      technique:
        - id: T1567
          name: Exfiltration Over Web Service
          reference: "https://attack.mitre.org/techniques/T1567/"
          subtechnique:
            - id: T1567.001
              name: Exfiltration to Code Repository
              reference: "https://attack.mitre.org/techniques/T1567/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0010
        name: Exfiltration
        reference: "https://atlas.mitre.org/tactics/AML.TA0010/"
      technique:
        - id: AML.T0086
          name: Exfiltration via AI Agent Tool Invocation
          reference: "https://atlas.mitre.org/techniques/AML.T0086/"
  timestamp_override: event.ingested
  type: eql
  version: 1
