id: f011ad76-2fc5-52ef-a92c-178abf2af46a_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code starting PowerShell with the execution policy set to Bypass or Unrestricted, which lets unsigned scripts run.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: PowerShell Execution Policy Bypassed by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating PowerShell Execution Policy Bypassed by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review the script that ran.
    - Check whether the policy is enforced by group policy.

    ### False positive analysis

    - Agents often run local scripts this way. Raise the severity for scripts outside the project.
  query: |
    process where host.os.type == "windows" and event.type == "start" and (process.parent.name : "claude.exe" or process.parent.command_line : "*.claude?shell-snapshots*") and
      process.name : ("powershell.exe", "pwsh.exe") and
      process.args : ("-ExecutionPolicy", "-ep", "-exec") and process.args : ("Bypass", "Unrestricted")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 21
  rule_id: f011ad76-2fc5-52ef-a92c-178abf2af46a
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: low
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Execution"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0053"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0005
        name: Execution
        reference: "https://atlas.mitre.org/tactics/AML.TA0005/"
      technique:
        - id: AML.T0053
          name: AI Agent Tool Invocation
          reference: "https://atlas.mitre.org/techniques/AML.T0053/"
  timestamp_override: event.ingested
  type: eql
  version: 1
