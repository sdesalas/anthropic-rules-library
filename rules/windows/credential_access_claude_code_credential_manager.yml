id: "78482f6a-cfc1-5d61-8726-046961585b7a_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code listing or reading saved Windows credentials with cmdkey, vaultcmd or PowerShell.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Windows Credential Manager Queried by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Windows Credential Manager Queried by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review which credentials were listed or read.
    - Rotate them if the request was not expected.

    ### False positive analysis

    - Debugging a credential helper. Confirm with the user.
  query: |
    process where host.os.type == "windows" and event.type == "start" and (process.parent.name : "claude.exe" or process.parent.command_line : "*.claude?shell-snapshots*") and
      (
        (process.name : "cmdkey.exe" and process.args : "/list") or
        (process.name : "vaultcmd.exe" and process.args : ("/list*", "/listcreds*")) or
        (process.name : ("powershell.exe", "pwsh.exe") and process.command_line : ("*Get-StoredCredential*", "*PasswordVault*"))
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "78482f6a-cfc1-5d61-8726-046961585b7a"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Credential Access"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.004
              name: Windows Credential Manager
              reference: "https://attack.mitre.org/techniques/T1555/004/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
  timestamp_override: event.ingested
  type: eql
  version: 1
