id: "6c593cc2-e082-4ef8-a913-7f1c1d308161_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code, or a shell it opened, reading passwords from the macOS keychain with the security tool. Claude Code reading its own login item is excluded.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Keychain Secrets Read by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Keychain Secrets Read by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review which item was read, from the service or account name in `process.args`.
    - Check where the secret went after it was read: a file, an environment variable or a network request.
    - Rotate the secret if the request was not expected.

    ### False positive analysis

    - Developers sometimes ask an agent to fetch a token from the keychain for a local tool. Confirm with the user.
  query: |
    process where host.os.type == "macos" and event.type == "start" and process.name == "security" and
      process.args in ("find-generic-password", "find-internet-password", "dump-keychain", "export") and
      (process.parent.name == "claude" or process.parent.command_line like "*/.claude/shell-snapshots/*") and
      not process.args like~ "Claude Code*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "6c593cc2-e082-4ef8-a913-7f1c1d308161"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.001
              name: Keychain
              reference: "https://attack.mitre.org/techniques/T1555/001/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
  timestamp_override: event.ingested
  type: eql
  version: 1
