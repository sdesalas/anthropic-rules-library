id: eb34c768-1904-5c25-a781-eb375fcee919_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code reading a browser's saved logins or cookies. These files give access to the user's web sessions and saved passwords.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Browser Credential Store Read by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Browser Credential Store Read by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Check what the session did with the file.
    - Sign the user out of sensitive sites and rotate saved passwords.

    ### False positive analysis

    - None expected.
  query: |
    process where host.os.type == "macos" and event.type == "start" and (process.parent.name == "claude" or process.parent.command_line like "*/.claude/shell-snapshots/*") and
      process.command_line like~ (
        "*/Library/Application Support/Google/Chrome/*Login Data*",
        "*/Library/Application Support/Google/Chrome/*Cookies*",
        "*/Library/Application Support/Firefox/Profiles/*logins.json*",
        "*/Library/Cookies/Cookies.binarycookies*"
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: eb34c768-1904-5c25-a781-eb375fcee919
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Credential Access"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0098"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.003
              name: Credentials from Web Browsers
              reference: "https://attack.mitre.org/techniques/T1555/003/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0013
        name: Credential Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0013/"
      technique:
        - id: AML.T0098
          name: AI Agent Tool Credential Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0098/"
  timestamp_override: event.ingested
  type: eql
  version: 1
