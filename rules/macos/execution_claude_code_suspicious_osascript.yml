id: d8ad19c2-2e64-4dba-bcd1-72b08e2a5d80_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code, or a shell it opened, running AppleScript that shows a password dialog, sends keystrokes, reads the clipboard, runs JavaScript in a browser or asks for administrator privileges.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Suspicious AppleScript Run by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating Suspicious AppleScript Run by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review the script in `process.command_line`. A password dialog is a common way to phish the user's login password.
    - Check what the agent did with the output, for example writing it to a file or sending it over the network.
    - Review the content the agent read before it ran the script.

    ### False positive analysis

    - UI automation tasks can send keystrokes. Confirm with the user.
  query: |
    process where host.os.type == "macos" and event.type == "start" and process.name == "osascript" and
      (process.parent.name == "claude" or process.parent.command_line like "*/.claude/shell-snapshots/*") and
      process.command_line like~ (
        "*display dialog*hidden answer*",
        "*keystroke*",
        "*with administrator privileges*",
        "*the clipboard*",
        "*do JavaScript*",
        "*execute*javascript*"
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: d8ad19c2-2e64-4dba-bcd1-72b08e2a5d80
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
