id: "9719d67b-6cac-5a1b-b630-d769e90b98ce_1"
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies Claude Code adding to an SSH authorized_keys file. A new key lets someone log in as the user from anywhere the host is reachable.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: SSH Authorized Keys Changed by Claude Code
  note: |
    ## Triage and analysis

    ### Investigating SSH Authorized Keys Changed by Claude Code

    Claude Code runs shell commands through a shell that sources a snapshot under `~/.claude/shell-snapshots`, so the rule matches both processes started by the `claude` process and processes started by that shell.

    ### Possible investigation steps

    - Review the key that was added and its comment.
    - Remove it if the user did not add it.

    ### False positive analysis

    - Setting up access to a dev VM. Confirm with the user.
  query: |
    process where host.os.type == "linux" and event.type == "start" and
      (process.parent.name == "claude" or process.command_line like "*/.claude/shell-snapshots/*") and
      process.command_line like~ "*authorized_keys*" and
      process.command_line like~ ("*>>*", "*tee*", "*cp *", "*ssh-copy-id*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "9719d67b-6cac-5a1b-b630-d769e90b98ce"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "Domain: GenAI"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Data Source: Elastic Defend"
    - "Tactic: Persistence"
    - "Rule Type: Event Correlation (EQL)"
    - "Mitre Atlas: AML.T0053"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
      technique:
        - id: T1098
          name: Account Manipulation
          reference: "https://attack.mitre.org/techniques/T1098/"
          subtechnique:
            - id: T1098.004
              name: SSH Authorized Keys
              reference: "https://attack.mitre.org/techniques/T1098/004/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0005
        name: Execution
        reference: "https://atlas.mitre.org/tactics/AML.TA0005/"
      technique:
        - id: AML.T0053
          name: AI Agent Tool Invocation
          reference: "https://atlas.mitre.org/techniques/AML.T0053/"
  timestamp_override: event.ingested
  type: eql
  version: 1
