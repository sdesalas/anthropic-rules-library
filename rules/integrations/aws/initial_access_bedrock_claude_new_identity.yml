id: e28128fa-8e9f-4971-b62d-d6cb2d8b719e_1
type: security-rule
attributes:
  author:
    - Anthropic Rules Library
  description: Identifies an IAM identity invoking a Claude model on Amazon Bedrock for the first time in 14 days. Stolen AWS keys are often used to run model calls at the victim's cost, a pattern known as LLMjacking.
  from: now-9m
  history_window_start: now-14d
  index:
    - "filebeat-*"
    - "logs-aws.cloudtrail-*"
  language: kuery
  license: Elastic License v2
  name: Claude Model on Bedrock Invoked by a New IAM Identity
  new_terms_fields:
    - aws.cloudtrail.user_identity.arn
  note: |
    ## Triage and analysis

    ### Investigating Claude Model on Bedrock Invoked by a New IAM Identity

    ### Possible investigation steps

    - Review the identity in `aws.cloudtrail.user_identity.arn` and whether it is expected to use Bedrock.
    - Check `source.ip` and `user_agent.original` against the identity's usual activity.
    - Review the volume of calls and the cost in AWS billing for the period.

    ### False positive analysis

    - New applications and developers start using Bedrock. Confirm with the account owner.
  query: |
    event.dataset:aws.cloudtrail and event.provider:bedrock.amazonaws.com and
      event.action:(InvokeModel or InvokeModelWithResponseStream or Converse or ConverseStream) and
      event.outcome:success and aws.cloudtrail.request_parameters:*anthropic.claude*
  related_integrations:
    - integration: cloudtrail
      package: aws
      version: ">=2.0.0"
  risk_score: 21
  rule_id: e28128fa-8e9f-4971-b62d-d6cb2d8b719e
  setup: |
    ## Setup

    This rule requires the AWS CloudTrail integration to be installed and collecting logs, with Amazon Bedrock API calls recorded in the trail.
  severity: low
  tags:
    - "Domain: Cloud"
    - "Domain: GenAI"
    - "Data Source: AWS"
    - "Data Source: AWS CloudTrail"
    - "Data Source: Amazon Bedrock"
    - "Use Case: Threat Detection"
    - "Tactic: Initial Access"
    - "Rule Type: New Terms"
    - "Mitre Atlas: AML.T0040"
    - "Mitre Atlas: AML.T0034"
    - "Resources: Investigation Guide"
    - "Source: Anthropic Rules Library"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
      technique:
        - id: T1078
          name: Valid Accounts
          reference: "https://attack.mitre.org/techniques/T1078/"
          subtechnique:
            - id: T1078.004
              name: Cloud Accounts
              reference: "https://attack.mitre.org/techniques/T1078/004/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0000
        name: AI Model Access
        reference: "https://atlas.mitre.org/tactics/AML.TA0000/"
      technique:
        - id: AML.T0040
          name: AI Model Inference API Access
          reference: "https://atlas.mitre.org/techniques/AML.T0040/"
    - framework: MITRE ATLAS
      tactic:
        id: AML.TA0011
        name: Impact
        reference: "https://atlas.mitre.org/tactics/AML.TA0011/"
      technique:
        - id: AML.T0034
          name: Cost Harvesting
          reference: "https://atlas.mitre.org/techniques/AML.T0034/"
  timestamp_override: event.ingested
  type: new_terms
  version: 1
